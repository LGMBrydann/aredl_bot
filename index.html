<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invite AREDL_Bot to Your Twitch Chat</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #0e0e10; color: #efeff1; padding-top: 120px; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #fff; }
        p { color: #adadb8; font-size: 1.1rem; margin-bottom: 30px; }
        .oauth-btn { background: #9146FF; color: white; border: none; padding: 16px 32px; font-size: 1.1rem; font-weight: 600; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.2s ease; }
        .oauth-btn:hover { background: #772CE8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AREDL_Bot</h1>
        <p>Authorize AREDL_Bot to join your channel and automatically monitor chat requests for Geometry Dash demon list statistics.</p>
        
        <!-- Points directly to your worker execution route -->
        <a class="oauth-btn" href="https://aredl-bot.workers.dev/auth/login">
            Connect with Twitch
        </a>
    </div>
</body>
</html>
